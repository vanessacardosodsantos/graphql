info:
  name: Delete Book
  type: graphql
  seq: 5

graphql:
  method: POST
  url: "{{url}}"
  body:
    query: |-
      mutation DeleteBook($id:ID!) {
      	deleteBook(id:$id)
      }
    variables: |-
      {
        "id":3
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
