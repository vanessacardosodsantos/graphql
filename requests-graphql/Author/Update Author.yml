info:
  name: Update Author
  type: graphql
  seq: 2

graphql:
  method: POST
  url: http://localhost:8080/graphql
  body:
    query: |-
      mutation UpdateAuthor($id:ID!, $input: AuthorInput!) {
        updateAuthor(id:$id, author: $input) {
          firstName
          lastName
        }
      }
    variables: |-
      {
        "id":1,
        "input": {
          "firstName":"Clarice",
          "lastName":"Cristie"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
