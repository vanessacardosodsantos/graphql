info:
  name: Delete Author
  type: graphql
  seq: 4

graphql:
  method: POST
  url: "{{url}}"
  body:
    query: |-
      mutation UpdateAuthor($id:ID!) {
        deleteAuthor(id:$id)
      }
    variables: |-
      {
        "id":3
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
